name: Docker CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test_dockerized_webserver:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Playwright
        run: npm install -D @playwright/test
      
      - name: Set up Playwright Browsers
        run:
            sudo apt-get update --fix-missing || true
            npx playwright install --with-deps chromium

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Launch Web Service
        run: docker compose up -d

      - name: Check Web Server Startup
        run: |
          sleep 10
          docker compose ps
          docker compose logs --no-color --tail=200 server
          curl -v http://localhost:8080/

      - name: Debug Docker
        run: |
          docker compose ps
          docker compose logs --tail=100 server
          docker port rentacat

      - name: Wait for Web Server
        timeout-minutes: 5
        run: sh wait-for-webserver.sh

      - name: Run Playwright Tests
        run: npx playwright test --project=chromium

        # https://github.com/marketplace/actions/upload-a-build-artifact
        # Upload even if the tests fail, so that you can inspect the failures
      - name: Upload Playwright results as artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: Playwright results
          path: playwright-report/
